            renderMenuSections();
        }));
        document.getElementById('export-btn').addEventListener('click', exportAnalytics);
        document.getElementById('reset-btn').addEventListener('click', resetAllData);
        document.getElementById('qr-generate-btn').addEventListener('click', generateQR);
        document.getElementById('qr-table-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') generateQR();
        });
    }

    function exportAnalytics() {
        const data = {
            exportedAt: new Date().toISOString(),
            analytics: state.analytics, ratings: state.ratings, favorites: state.favorites,
            availability: state.availability, orderHistory: state.orderHistory
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `aroastotle-analytics-${Date.now()}.json`;
        a.click(); URL.revokeObjectURL(url);
        showToast(t('analyticsExported')); playSound('success'); haptic();
    }

    // ============================================
    // QR CODE GENERATOR
    // ============================================
    function generateQR() {
        const tableInput = document.getElementById('qr-table-input');
        const table = tableInput.value.trim();

        const baseUrl = window.location.origin + window.location.pathname;
        const targetUrl = table ? `${baseUrl}?table=${encodeURIComponent(table)}` : baseUrl;

        if (window.location.protocol === 'file:') {
            showToast('Host online first for QR to work', false);
            playSound('error');
            return;
        }

        const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(targetUrl)}&bgcolor=1A1817&color=C5A059&margin=12&qzone=2`;

        const preview = document.getElementById('qr-preview');
        preview.classList.add('show');
        preview.innerHTML = `
            <img src="${qrApiUrl}" alt="QR Code" crossorigin="anonymous" id="qr-img">
            <div class="qr-caption">
                <strong>${table ? 'Table ' + table : 'Scan to view menu'}</strong>
                ${table ? 'Guests scan → table auto-fills at checkout' : 'Point any phone camera here to open the menu'}
            </div>
            <div class="qr-actions">
                <button class="qr-action-btn qr-action-primary" id="qr-download-btn">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    Download PNG
                </button>
                <button class="qr-action-btn qr-action-secondary" id="qr-print-btn">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 6 2 18 2 18 9"></polyline>
                        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                        <rect x="6" y="14" width="12" height="8"></rect>
                    </svg>
                    Print Card
                </button>
            </div>
        `;

        document.getElementById('qr-download-btn').addEventListener('click', () => downloadQRCard(qrApiUrl, table));
        document.getElementById('qr-print-btn').addEventListener('click', () => printQRCard(qrApiUrl, table, targetUrl));

        playSound('pop'); haptic();
    }

    async function downloadQRCard(qrApiUrl, table) {
        try {
            showToast('Preparing card...');
            const canvas = document.createElement('canvas');
            const size = 900;
            canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#1A1817';
            ctx.fillRect(0, 0, size, size);

            ctx.strokeStyle = 'rgba(197,160,89,0.3)';
            ctx.lineWidth = 2;
            ctx.strokeRect(30, 30, size - 60, size - 60);

            ctx.strokeStyle = '#C5A059';
            ctx.lineWidth = 4;
            ctx.strokeRect(20, 20, size - 40, size - 40);

            ctx.fillStyle = '#F5F5F0';
            ctx.font = 'italic 68px "Playfair Display", Georgia, serif';
            ctx.textAlign = 'center';
            ctx.fillText('Aroastotle', size / 2, 130);

            ctx.fillStyle = '#C5A059';
            ctx.font = '600 20px "Montserrat", sans-serif';
            ctx.fillText('C A F E', size / 2, 165);

            const img = new Image();
            img.crossOrigin = 'anonymous';
            await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; img.src = qrApiUrl; });

            const qrSize = 460;
            const qrY = 220;
            ctx.fillStyle = '#FFFFFF';
            const r = 20;
            const qx = (size - qrSize) / 2 - 20;
            const qy = qrY - 20;
            const qw = qrSize + 40;
            const qh = qrSize + 40;
            ctx.beginPath();
            ctx.moveTo(qx + r, qy);
            ctx.arcTo(qx + qw, qy, qx + qw, qy + qh, r);
            ctx.arcTo(qx + qw, qy + qh, qx, qy + qh, r);
            ctx.arcTo(qx, qy + qh, qx, qy, r);
            ctx.arcTo(qx, qy, qx + qw, qy, r);
            ctx.closePath();
            ctx.fill();
            ctx.drawImage(img, (size - qrSize) / 2, qrY, qrSize, qrSize);

            ctx.fillStyle = '#C5A059';
            ctx.font = 'italic 34px "Playfair Display", Georgia, serif';
            const caption = table ? `Table ${table}` : 'Scan to View Menu';
            ctx.fillText(caption, size / 2, qrY + qrSize + 85);

            ctx.fillStyle = '#A0A0A0';
            ctx.font = '400 18px "Montserrat", sans-serif';
            ctx.fillText('Point your phone camera here', size / 2, qrY + qrSize + 125);

            ctx.strokeStyle = '#C5A059';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(size / 2 - 40, qrY + qrSize + 155);
            ctx.lineTo(size / 2 + 40, qrY + qrSize + 155);
            ctx.stroke();

            canvas.toBlob((blob) => {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `aroastotle-qr-${table ? 'table-' + table : 'menu'}.png`;
                a.click();
                URL.revokeObjectURL(a.href);
                showToast('QR card downloaded ✓');
                playSound('success'); haptic();
            }, 'image/png');
        } catch (err) {
            showToast('Failed to generate card', false);
            playSound('error');
        }
    }

    function printQRCard(qrApiUrl, table, targetUrl) {
        const w = window.open('', '_blank', 'width=600,height=800');
        w.document.write(`
            <!DOCTYPE html>
            <html>
            <head>
                <title>Aroastotle QR — ${table ? 'Table ' + table : 'Menu'}</title>
                <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
                <style>
                    @page { size: A6; margin: 0; }
                    * { margin: 0; padding: 0; box-sizing: border-box; }
                    body { background: #1A1817; color: #F5F5F0; font-family: 'Montserrat', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
                    .card { width: 100%; max-width: 400px; background: #1A1817; border: 3px solid #C5A059; border-radius: 24px; padding: 40px 30px; text-align: center; }
                    .brand { font-family: 'Playfair Display', serif; font-style: italic; font-size: 42px; color: #F5F5F0; letter-spacing: -1px; }
                    .brand-sub { font-size: 11px; letter-spacing: 6px; color: #C5A059; margin-top: 2px; font-weight: 600; }
                    .qr-plate { background: #FFFFFF; border-radius: 16px; padding: 16px; display: inline-block; margin: 28px 0; }
                    .qr-plate img { display: block; width: 240px; height: 240px; }
                    .caption { font-family: 'Playfair Display', serif; font-style: italic; font-size: 26px; color: #C5A059; margin-bottom: 8px; }
                    .instruction { font-size: 13px; color: #A0A0A0; letter-spacing: 0.5px; }
                    .line { width: 60px; height: 2px; background: #C5A059; margin: 24px auto 0; }
                    @media print { body { padding: 0; } .card { border-radius: 0; max-width: 100%; } }
                </style>
            </head>
            <body onload="setTimeout(() => window.print(), 800);">
                <div class="card">
                    <div class="brand">Aroastotle</div>
                    <div class="brand-sub">C A F E</div>
                    <div class="qr-plate"><img src="${qrApiUrl}" alt="QR"></div>
                    <div class="caption">${table ? 'Table ' + table : 'Scan to View Menu'}</div>
                    <div class="instruction">Point your phone camera here</div>
                    <div class="line"></div>
                </div>
            </body>
            </html>
        `);
        w.document.close();
        showToast('Print dialog opening...');
        playSound('success');
    }

    function resetAllData() {
        const btn = document.getElementById('reset-btn');
        const label = document.getElementById('reset-label');
        if (btn.dataset.confirming !== '1') {
            btn.dataset.confirming = '1'; label.textContent = t('resetConfirm');
            btn.style.borderColor = 'var(--danger)'; btn.style.color = 'var(--danger)';
            playSound('error');
            setTimeout(() => {
                if (btn.dataset.confirming === '1') {
                    btn.dataset.confirming = '0'; label.textContent = t('resetAll');
                    btn.style.borderColor = ''; btn.style.color = '';
                }
            }, 3000);
            return;
        }
        ['aro-favs', 'aro-cart', 'aro-ratings', 'aro-analytics', 'aro-availability', 'aro-recent', 'aro-table', 'aro-current-order', 'aro-order-history'].forEach(k => localStorage.removeItem(k));
        showToast(t('dataReset'), false); playSound('success'); haptic(30);
        setTimeout(() => location.reload(), 800);
    }

    function openSheet(el) { overlay.classList.add('open'); el.classList.add('open'); document.body.classList.add('no-scroll'); }
    function closeAllSheets() {
        overlay.classList.remove('open');
        [itemSheet, cartDrawer, adminModal].forEach(s => s.classList.remove('open'));
        document.body.classList.remove('no-scroll');
    }

    window.addEventListener('scroll', () => {
        if (window.scrollY > 50) header.classList.add('scrolled'); else header.classList.remove('scrolled');
        const dh = document.documentElement.scrollHeight - window.innerHeight;
        scrollProgress.style.width = (dh > 0 ? (window.scrollY / dh) * 100 : 0) + '%';
        if (window.scrollY > 400) backToTop.classList.add('visible'); else backToTop.classList.remove('visible');
    });

    backToTop.addEventListener('click', () => { window.scrollTo({ top: 0, behavior: 'smooth' }); playSound('click'); haptic(); });
    themeToggle.addEventListener('click', toggleTheme);
    langToggle.addEventListener('click', toggleLanguage);
    soundToggle.addEventListener('click', toggleSound);
    musicToggle.addEventListener('click', toggleMusic);
    shareBtn.addEventListener('click', shareMenu);

    document.addEventListener('pointerdown', startMusicOnFirstInteraction, { once: true });
    document.addEventListener('keydown', startMusicOnFirstInteraction, { once: true });

    brandLogo.addEventListener('click', () => {
        playBrandAnimation();
        state.logoTapCount++;
        clearTimeout(state.logoTapTimer);
        state.logoTapTimer = setTimeout(() => { state.logoTapCount = 0; }, 600);
        if (state.logoTapCount >= 3) { state.logoTapCount = 0; openAdmin(); }
    });

    navTabsContainer.addEventListener('click', (e) => {
        const tab = e.target.closest('.nav-tab'); if (!tab) return;
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const cat = tab.dataset.category;
        state.currentCategory = cat;
        if (state.searchQuery) {
            searchInput.value = ''; state.searchQuery = ''; searchClear.classList.remove('visible');
            const s = document.getElementById('search-results'); if (s) s.remove();
        }
        if (cat === 'favorites') renderFavorites();
        document.querySelectorAll('.menu-section').forEach(s => s.classList.remove('active'));
        const target = document.getElementById(cat);
        if (target) {
            target.classList.add('active');
            target.querySelectorAll('.menu-item').forEach((el, i) => {
                el.style.animation = 'none'; el.offsetHeight;
                el.style.animation = `itemIn 0.5s cubic-bezier(0.25, 1, 0.5, 1) ${i * 0.04}s backwards`;
            });
        }
        const navHeight = document.getElementById('category-nav').offsetHeight;
        const menuTop = menuContainer.getBoundingClientRect().top + window.scrollY - navHeight - 10;
        window.scrollTo({ top: menuTop, behavior: 'smooth' });
        playSound('click'); haptic();
    });

    menuContainer.addEventListener('click', (e) => {
        const favBtn = e.target.closest('.fav-btn');
        if (favBtn) {
            e.stopPropagation();
            toggleFavorite(favBtn.dataset.fav);
            favBtn.classList.toggle('active');
            if (state.currentCategory === 'favorites') renderFavorites();
            return;
        }
        const itemEl = e.target.closest('.menu-item');
        if (itemEl && !itemEl.classList.contains('sold-out')) openItemSheet(itemEl.dataset.item, itemEl.dataset.cat);
    });

    overlay.addEventListener('click', closeAllSheets);
    cartFab.addEventListener('click', () => { renderCart(); openSheet(cartDrawer); playSound('open'); haptic(); });

    searchToggle.addEventListener('click', () => {
        searchWrapper.classList.toggle('open');
        if (searchWrapper.classList.contains('open')) setTimeout(() => searchInput.focus(), 300);
        playSound('click'); haptic();
    });
    searchInput.addEventListener('input', (e) => {
        state.searchQuery = e.target.value;
        if (state.searchQuery) searchClear.classList.add('visible'); else searchClear.classList.remove('visible');
        renderSearchResults(state.searchQuery);
    });
    searchClear.addEventListener('click', () => {
        searchInput.value = ''; state.searchQuery = ''; searchClear.classList.remove('visible');
        renderSearchResults(''); searchInput.focus();
    });

    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAllSheets(); });

    if (state.currentOrder && !state.orderBarHidden) {
        setTimeout(() => {
            updateOrderBar(); showOrderBar();
            const stage = getOrderStage(state.currentOrder);
            if (stage < 3) showToast(`Order ${state.currentOrder.id} is in progress`);
        }, 1800);
    }

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault(); state.deferredPrompt = e;
        if (!localStorage.getItem('aro-install-dismissed')) setTimeout(() => installBanner.classList.add('show'), 3000);
    });
    document.getElementById('install-btn').addEventListener('click', async () => {
        if (!state.deferredPrompt) return;
        state.deferredPrompt.prompt();
        const { outcome } = await state.deferredPrompt.userChoice;
        if (outcome === 'accepted') showToast('App installed');
        state.deferredPrompt = null; installBanner.classList.remove('show');
    });
    document.getElementById('install-dismiss').addEventListener('click', () => {
        installBanner.classList.remove('show');
        localStorage.setItem('aro-install-dismissed', '1');
    });

    const manifest = {
        name: 'Aroastotle Cafe', short_name: 'Aroastotle', description: 'Premium cafe menu',
        start_url: '.', display: 'standalone', background_color: '#1A1817', theme_color: '#C5A059', orientation: 'portrait',
        icons: [{ src: 'data:image/svg+xml;base64,' + btoa(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="40" fill="#1A1817"/><text x="96" y="125" font-family="Georgia,serif" font-style="italic" font-size="90" fill="#C5A059" text-anchor="middle">A</text></svg>`), sizes: '192x192', type: 'image/svg+xml', purpose: 'any maskable' }]
    };
    const manifestURL = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/json' }));
    const mLink = document.createElement('link');
    mLink.rel = 'manifest'; mLink.href = manifestURL;
    document.head.appendChild(mLink);

    function init() {
        applyTheme(state.theme);
        splitBrandLetters();
        langToggle.textContent = state.language === 'en' ? 'EN' : 'TL';
        soundToggle.classList.toggle('muted', !state.soundEnabled);
        musicToggle.classList.toggle('muted', !state.musicEnabled);
        bgMusic.volume = 0.35;
        if (state.musicEnabled) {
            bgMusic.play().then(() => musicToggle.classList.add('playing')).catch(() => {});
        }

        renderNavTabs(); renderMenuSections(); renderAddOns();
        renderRecentlyViewed(); updateCartBadge();
        applyLanguage(state.language);
        observeScrollReveals();

        if (state.tableNumber) {
            tableBadge.textContent = `Table ${state.tableNumber}`;
            tableBadge.classList.add('show');
            setTimeout(() => {
                showToast(`Welcome! Table ${state.tableNumber}`);
                playSound('success');
            }, 1800);
        }

        setTimeout(() => loader.classList.add('hidden'), 1400);
    }
    init();
});
</script>
</body>
