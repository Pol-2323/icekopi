<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1A1817" id="theme-color-meta">
    <title>Aroastotle Cafe | Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root, [data-theme="dark"] {
            --bg-color: #1A1817; --surface-color: #242220; --surface-elevated: #2E2B28;
            --text-primary: #F5F5F0; --text-secondary: #A0A0A0;
            --accent-gold: #C5A059; --accent-gold-bright: #E5C580; --accent-gold-dim: rgba(197, 160, 89, 0.1);
            --border-color: rgba(255, 255, 255, 0.06); --danger: #D9534F; --success: #4CAF50;
            --overlay-bg: rgba(0, 0, 0, 0.7); --shadow-lg: 0 -10px 40px rgba(0, 0, 0, 0.5);
            --cart-shadow: 0 8px 24px rgba(197, 160, 89, 0.4);
        }
        [data-theme="light"] {
            --bg-color: #FAF7F2; --surface-color: #FFFFFF; --surface-elevated: #FFFFFF;
            --text-primary: #1A1817; --text-secondary: #6B6B6B;
            --accent-gold: #A8823E; --accent-gold-bright: #C9A160; --accent-gold-dim: rgba(168, 130, 62, 0.12);
            --border-color: rgba(0, 0, 0, 0.08); --danger: #C0392B; --success: #2E7D32;
            --overlay-bg: rgba(0, 0, 0, 0.4); --shadow-lg: 0 -10px 40px rgba(0, 0, 0, 0.15);
            --cart-shadow: 0 8px 24px rgba(168, 130, 62, 0.35);
        }
        :root {
            --font-heading: 'Playfair Display', serif; --font-body: 'Montserrat', sans-serif;
            --transition-smooth: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            --transition-spring: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { scroll-behavior: smooth; }
        body { background: var(--bg-color); color: var(--text-primary); font-family: var(--font-body); line-height: 1.5; overflow-x: hidden; padding-bottom: 120px; -webkit-font-smoothing: antialiased; transition: background-color 0.5s ease, color 0.5s ease; }
        body.no-scroll { overflow: hidden; }
        body.theme-transitioning * { transition: background-color 0.5s ease, color 0.5s ease, border-color 0.5s ease !important; }

        #scroll-progress { position: fixed; top: 0; left: 0; height: 2px; background: linear-gradient(90deg, var(--accent-gold), var(--accent-gold-bright)); width: 0%; z-index: 9999; transition: width 0.1s linear; box-shadow: 0 0 10px var(--accent-gold); }

        #loader { position: fixed; inset: 0; background: var(--bg-color); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.8s ease, visibility 0.8s ease; }
        #loader.hidden { opacity: 0; visibility: hidden; }
        #loader .loader-brand { font-family: var(--font-heading); font-size: 3rem; font-style: italic; color: var(--text-primary); opacity: 0; animation: loaderFade 1.2s ease forwards 0.2s; }
        #loader .loader-line { width: 0; height: 1px; background: var(--accent-gold); margin: 15px 0; animation: loaderLine 1s ease forwards 0.6s; }
        #loader .loader-sub { font-size: 0.7rem; letter-spacing: 0.5em; color: var(--accent-gold); text-transform: uppercase; opacity: 0; animation: loaderFade 1s ease forwards 0.9s; }
        @keyframes loaderFade { to { opacity: 1; } }
        @keyframes loaderLine { to { width: 80px; } }

        #main-header { text-align: center; padding: 40px 20px 20px; position: relative; z-index: 10; transition: var(--transition-smooth); }
        .logo-container { display: flex; flex-direction: column; align-items: center; position: relative; }
        .brand-name { font-family: var(--font-heading); font-size: 3rem; font-weight: 400; font-style: italic; color: var(--text-primary); letter-spacing: -1px; margin-bottom: -5px; transition: var(--transition-smooth); cursor: pointer; user-select: none; position: relative; }
        .brand-sub { font-family: var(--font-body); font-size: 0.8rem; letter-spacing: 0.5em; color: var(--accent-gold); text-transform: uppercase; font-weight: 500; margin-left: 0.5em; }

        /* BRAND NAME ANIMATION */
        .brand-name .letter { display: inline-block; transition: color 0.3s ease; will-change: transform; }
        .brand-name.animating .letter {
            animation: letterWave 1.15s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            animation-delay: calc(var(--i) * 0.055s);
        }
        @keyframes letterWave {
            0%   { transform: translateY(0) rotate(0) scale(1); color: var(--text-primary); text-shadow: none; }
            30%  { transform: translateY(-16px) rotate(-3deg) scale(1.18); color: var(--accent-gold-bright); text-shadow: 0 0 24px var(--accent-gold), 0 0 48px var(--accent-gold-dim), 0 4px 12px rgba(0,0,0,0.4); }
            55%  { transform: translateY(2px) rotate(2deg) scale(1.05); color: var(--accent-gold); text-shadow: 0 0 16px var(--accent-gold-dim); }
            75%  { transform: translateY(-4px) rotate(-1deg) scale(1.02); color: var(--accent-gold-bright); }
            100% { transform: translateY(0) rotate(0) scale(1); color: var(--text-primary); text-shadow: none; }
        }
        .brand-name::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(100deg, transparent 30%, var(--accent-gold-bright) 50%, transparent 70%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            opacity: 0; pointer-events: none; background-size: 250% 100%; background-position: -50% 0;
            mix-blend-mode: screen;
        }
        .brand-name.animating::after { animation: shimmerSweep 1.15s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        @keyframes shimmerSweep {
            0% { background-position: -50% 0; opacity: 0; }
            20% { opacity: 1; } 80% { opacity: 1; }
            100% { background-position: 150% 0; opacity: 0; }
        }
        .gold-particle {
            position: fixed; width: var(--size, 5px); height: var(--size, 5px);
            background: radial-gradient(circle, var(--accent-gold-bright) 0%, var(--accent-gold) 60%, transparent 100%);
            border-radius: 50%; pointer-events: none; z-index: 9998;
            box-shadow: 0 0 10px var(--accent-gold), 0 0 20px var(--accent-gold-dim);
            animation: particleBurst 1.3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            animation-delay: var(--delay, 0s);
        }
        @keyframes particleBurst {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            20% { transform: translate(calc(-50% + var(--dx) * 0.35), calc(-50% + var(--dy) * 0.35)) scale(1.4); opacity: 1; }
            100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.2); opacity: 0; }
        }
        .brand-ripple {
            position: fixed; border: 2px solid var(--accent-gold); border-radius: 50%;
            pointer-events: none; z-index: 9997; animation: rippleRing 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            transform: translate(-50%, -50%); box-shadow: 0 0 20px var(--accent-gold-dim), inset 0 0 20px var(--accent-gold-dim);
        }
        @keyframes rippleRing {
            0% { width: 0; height: 0; opacity: 1; border-width: 3px; }
            100% { width: 340px; height: 340px; opacity: 0; border-width: 0.5px; }
        }

        .header-actions { position: absolute; top: 50%; right: 20px; transform: translateY(-50%); display: flex; gap: 6px; }
        .icon-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-primary); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: var(--transition-smooth); position: relative; overflow: hidden; }
        .icon-btn:hover, .icon-btn:active { border-color: var(--accent-gold); color: var(--accent-gold); transform: scale(1.08); }
        .icon-btn svg { width: 15px; height: 15px; transition: var(--transition-spring); }
        #theme-toggle .sun-icon { display: none; } #theme-toggle .moon-icon { display: block; }
        [data-theme="light"] #theme-toggle .sun-icon { display: block; } [data-theme="light"] #theme-toggle .moon-icon { display: none; }
        #lang-toggle { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.5px; }
        #sound-toggle .sound-off-icon { display: none; }
        #sound-toggle.muted .sound-off-icon { display: block; }
        #sound-toggle.muted .sound-on-icon { display: none; }

        #music-toggle .music-on-icon { display: block; }
        #music-toggle .music-off-icon { display: none; }
        #music-toggle.muted .music-on-icon { display: none; }
        #music-toggle.muted .music-off-icon { display: block; }
        #music-toggle.muted { color: var(--text-secondary); border-color: var(--border-color); opacity: 0.5; transition: color 0.35s ease, border-color 0.35s ease, opacity 0.35s ease, transform 0.35s ease; }
        #music-toggle.muted:hover { color: var(--accent-gold); border-color: var(--accent-gold); opacity: 1; transform: scale(1.08); }
        #music-toggle.playing { border-color: var(--accent-gold); color: var(--accent-gold); opacity: 1; animation: musicPulse 2s ease-in-out infinite; transition: color 0.35s ease, border-color 0.35s ease, opacity 0.35s ease; }
        #music-toggle.playing:hover { transform: scale(1.08); box-shadow: 0 0 20px var(--accent-gold-dim); }
        @keyframes musicPulse { 0%, 100% { box-shadow: 0 0 0 0 var(--accent-gold-dim); } 50% { box-shadow: 0 0 0 8px transparent; } }

        #main-header.scrolled { padding: 12px 20px; background: color-mix(in srgb, var(--bg-color) 95%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color); }
        #main-header.scrolled .brand-name { font-size: 1.8rem; } #main-header.scrolled .brand-sub { font-size: 0.55rem; }
        #main-header.scrolled .header-actions { transform: translateY(-50%) scale(0.85); }

        .table-badge { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); background: var(--accent-gold-dim); border: 1px solid var(--accent-gold); color: var(--accent-gold); font-size: 0.65rem; font-weight: 600; padding: 3px 10px; border-radius: 10px; white-space: nowrap; margin-top: 10px; opacity: 0; transition: var(--transition-smooth); }
        .table-badge.show { opacity: 1; }

        #install-banner { max-height: 0; overflow: hidden; transition: max-height 0.6s cubic-bezier(0.25, 1, 0.5, 1), padding 0.4s ease; padding: 0 20px; max-width: 600px; margin: 0 auto; }
        #install-banner.show { max-height: 100px; padding-top: 10px; }
        .install-content { display: flex; align-items: center; gap: 12px; background: var(--surface-color); border: 1px solid var(--accent-gold); border-radius: 12px; padding: 12px 16px; }
        .install-text { flex: 1; font-size: 0.8rem; color: var(--text-secondary); }
        .install-text strong { color: var(--text-primary); display: block; font-size: 0.85rem; margin-bottom: 2px; }
        .install-btn { background: var(--accent-gold); color: var(--bg-color); border: none; padding: 8px 16px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: var(--transition-smooth); }
        .install-btn:hover { transform: scale(1.05); }
        .install-dismiss { background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 4px; display: flex; }
        .install-dismiss svg { width: 14px; height: 14px; }

        #search-wrapper { max-height: 0; overflow: hidden; transition: max-height 0.5s cubic-bezier(0.25, 1, 0.5, 1); padding: 0 20px; max-width: 600px; margin: 0 auto; }
        #search-wrapper.open { max-height: 80px; }
        .search-input-container { position: relative; margin: 10px 0 5px; }
        .search-input { width: 100%; background: var(--surface-color); border: 1px solid var(--border-color); color: var(--text-primary); padding: 14px 40px 14px 45px; border-radius: 12px; font-family: var(--font-body); font-size: 0.9rem; outline: none; transition: var(--transition-smooth); }
        .search-input:focus { border-color: var(--accent-gold); box-shadow: 0 0 0 3px var(--accent-gold-dim); }
        .search-input::placeholder { color: var(--text-secondary); }
        .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); pointer-events: none; }
        .search-clear { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: transparent; border: none; color: var(--text-secondary); cursor: pointer; padding: 5px; display: none; }
        .search-clear.visible { display: block; }

        #recent-strip { max-height: 0; overflow: hidden; transition: max-height 0.5s cubic-bezier(0.25, 1, 0.5, 1); padding: 0 20px; max-width: 600px; margin: 0 auto; }
        #recent-strip.show { max-height: 90px; padding: 12px 20px 0; }
        .recent-label { font-size: 0.65rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 8px; font-weight: 600; }
        .recent-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
        .recent-scroll::-webkit-scrollbar { display: none; }
        .recent-chip { background: var(--surface-color); border: 1px solid var(--border-color); color: var(--text-primary); padding: 7px 14px; border-radius: 20px; font-size: 0.78rem; white-space: nowrap; cursor: pointer; font-family: var(--font-body); }
        .recent-chip:hover { border-color: var(--accent-gold); color: var(--accent-gold); }
        .recent-chip:active { transform: scale(0.95); }

        #category-nav { position: sticky; top: 0; z-index: 100; background-color: var(--bg-color); border-bottom: 1px solid var(--border-color); }
        .nav-scroll-container { display: flex; overflow-x: auto; gap: 22px; padding: 0 20px; scroll-behavior: smooth; scrollbar-width: none; }
        .nav-scroll-container::-webkit-scrollbar { display: none; }
        .nav-tab { background: none; border: none; color: var(--text-secondary); font-family: var(--font-body); font-size: 0.8rem; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; padding: 18px 0; white-space: nowrap; cursor: pointer; position: relative; display: flex; align-items: center; gap: 6px; }
        .nav-tab:hover { color: var(--text-primary); } .nav-tab.active { color: var(--accent-gold); }
        .nav-tab .fav-count { background: var(--accent-gold); color: var(--bg-color); font-size: 0.6rem; padding: 1px 6px; border-radius: 8px; font-weight: 600; }
        .nav-tab::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; background: var(--accent-gold); transform: scaleX(0); transform-origin: right; transition: transform 0.3s ease; }
        .nav-tab.active::after { transform: scaleX(1); transform-origin: left; }

        #menu-container { padding: 20px; max-width: 600px; margin: 0 auto; min-height: 50vh; }
        .menu-section { display: none; }
        .menu-section.active { display: block; animation: sectionIn 0.5s cubic-bezier(0.25, 1, 0.5, 1); }
        @keyframes sectionIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .section-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
        .section-title { font-family: var(--font-heading); font-size: 1.6rem; color: var(--accent-gold); font-weight: 400; font-style: italic; }
        .size-headers { display: flex; gap: 15px; font-size: 0.6rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; font-weight: 500; }

        .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--border-color); cursor: pointer; animation: itemIn 0.5s cubic-bezier(0.25, 1, 0.5, 1) backwards; position: relative; }
        @keyframes itemIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .item-name { transition: var(--transition-smooth); }
        .item-info { flex: 1; padding-right: 10px; }
        .item-name { font-family: var(--font-body); font-size: 1rem; font-weight: 400; color: var(--text-primary); margin-bottom: 2px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .item-note { font-size: 0.72rem; color: var(--text-secondary); font-style: italic; margin-top: 4px; display: block; line-height: 1.4; }
        .item-meta { display: flex; align-items: center; gap: 10px; margin-top: 4px; font-size: 0.7rem; color: var(--text-secondary); }
        .item-meta .stars-mini { color: var(--accent-gold); letter-spacing: -1px; }
        .pop-badge { background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-bright)); color: var(--bg-color); font-size: 0.55rem; font-weight: 700; padding: 2px 7px; border-radius: 8px; letter-spacing: 0.8px; text-transform: uppercase; }
        .pop-badge::before { content: '🔥 '; }
        .item-actions { display: flex; align-items: center; gap: 12px; }
        .item-prices { display: flex; gap: 15px; min-width: 110px; justify-content: flex-end; }
        .price { font-family: var(--font-body); font-size: 0.9rem; color: var(--accent-gold); font-weight: 500; width: 30px; text-align: right; }
        .price.single { width: auto; min-width: 40px; }
        .fav-btn { background: transparent; border: none; color: var(--text-secondary); cursor: pointer; padding: 6px; display: flex; align-items: center; }
        .fav-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; }
        .fav-btn.active { color: var(--accent-gold); } .fav-btn.active svg { fill: var(--accent-gold); }
        .menu-item.sold-out { opacity: 0.35; pointer-events: none; }
        .menu-item.sold-out .item-name { text-decoration: line-through; text-decoration-color: var(--text-secondary); color: var(--text-secondary); }
        .menu-item.sold-out .price { color: var(--text-secondary); }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
        .empty-state svg { width: 48px; height: 48px; stroke: var(--text-secondary); opacity: 0.4; margin-bottom: 15px; }
        .empty-state h3 { font-family: var(--font-heading); font-size: 1.2rem; font-style: italic; color: var(--text-primary); margin-bottom: 6px; font-weight: 400; }
        .empty-state p { font-size: 0.85rem; }

        .addons-wrapper { padding: 0 20px; max-width: 600px; margin: 0 auto 40px; }
        details.addons { background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; }
        details.addons summary { padding: 18px 20px; font-family: var(--font-heading); font-size: 1.15rem; color: var(--accent-gold); font-style: italic; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
        details.addons summary::-webkit-details-marker { display: none; }
        details.addons summary::after { content: '+'; font-size: 1.4rem; font-weight: 300; color: var(--text-secondary); transition: transform 0.3s ease; }
        details[open].addons summary::after { transform: rotate(45deg); color: var(--accent-gold); }
        .addons-content { padding: 0 20px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .addon-item { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--text-primary); padding-bottom: 8px; border-bottom: 1px dashed var(--border-color); }
        .addon-price { color: var(--accent-gold); font-weight: 500; }

        .sheet-overlay { position: fixed; inset: 0; background: var(--overlay-bg); backdrop-filter: blur(4px); z-index: 500; opacity: 0; visibility: hidden; transition: opacity 0.35s ease, visibility 0.35s ease; }
        .sheet-overlay.open { opacity: 1; visibility: visible; }
        .bottom-sheet, .cart-drawer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface-elevated); border-radius: 24px 24px 0 0; z-index: 501; max-height: 90vh; overflow-y: auto; transform: translateY(100%); transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1); box-shadow: var(--shadow-lg); padding-bottom: 20px; }
        .bottom-sheet.open, .cart-drawer.open { transform: translateY(0); }
        .sheet-handle { width: 40px; height: 4px; background: var(--border-color); border-radius: 2px; margin: 12px auto 8px; }
        .sheet-content, .cart-content { padding: 15px 24px 24px; max-width: 600px; margin: 0 auto; }
        .sheet-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; gap: 15px; }
        .sheet-title { font-family: var(--font-heading); font-size: 1.6rem; font-style: italic; color: var(--text-primary); font-weight: 400; line-height: 1.2; }
        .sheet-subtitle { font-size: 0.75rem; color: var(--text-secondary); margin-top: 4px; display: block; }
        .sheet-close { background: transparent; border: none; color: var(--text-secondary); cursor: pointer; padding: 5px; flex-shrink: 0; transition: var(--transition-smooth); }
        .sheet-close:hover { color: var(--text-primary); transform: rotate(90deg); }
        .sheet-close svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; }
        .sheet-group { margin-bottom: 22px; }
        .sheet-label { font-size: 0.7rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 10px; font-weight: 600; }
        .pill-group { display: flex; flex-wrap: wrap; gap: 8px; }
        .pill { background: transparent; border: 1px solid var(--border-color); color: var(--text-secondary); padding: 10px 16px; border-radius: 24px; font-family: var(--font-body); font-size: 0.8rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 80px; }
        .pill:hover { border-color: var(--accent-gold); color: var(--text-primary); }
        .pill.active { background: var(--accent-gold); color: var(--bg-color); border-color: var(--accent-gold); font-weight: 500; }
        .pill small { font-size: 0.65rem; opacity: 0.75; } .pill.active small { opacity: 0.9; }

        .addon-check { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border: 1px solid var(--border-color); border-radius: 10px; cursor: pointer; margin-bottom: 8px; }
        .addon-check:hover { border-color: var(--accent-gold); }
        .addon-check.active { border-color: var(--accent-gold); background: var(--accent-gold-dim); }
        .addon-check-name { display: flex; align-items: center; gap: 10px; font-size: 0.88rem; color: var(--text-primary); }
        .check-box { width: 18px; height: 18px; border: 1.5px solid var(--text-secondary); border-radius: 5px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .addon-check.active .check-box { background: var(--accent-gold); border-color: var(--accent-gold); }
        .check-box svg { width: 12px; height: 12px; stroke: var(--bg-color); stroke-width: 3; opacity: 0; }
        .addon-check.active .check-box svg { opacity: 1; }
        .addon-check-price { font-size: 0.85rem; color: var(--accent-gold); font-weight: 500; }

            flex: 1; padding: 11px 12px; border-radius: 10px;
            font-family: var(--font-body); font-size: 0.76rem; font-weight: 500;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            gap: 5px; transition: var(--transition-smooth);
        }
        .qr-action-btn svg { width: 13px; height: 13px; stroke: currentColor; stroke-width: 2; fill: none; }
        .qr-action-primary { background: var(--accent-gold); color: var(--bg-color); border: none; }
        .qr-action-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 16px var(--accent-gold-dim); }
        .qr-action-secondary { background: transparent; color: var(--text-primary); border: 1px solid var(--border-color); }
        .qr-action-secondary:hover { border-color: var(--accent-gold); color: var(--accent-gold); }

        .qr-hint { font-size: 0.68rem; color: var(--text-secondary); margin-top: 10px; font-style: italic; opacity: 0.75; text-align: center; }

        /* HOVER ANIMATIONS */
        .menu-item { transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s ease, padding 0.35s ease, border-radius 0.3s ease, border-bottom-color 0.3s ease; }
        .menu-item:hover { transform: translateX(6px); background: linear-gradient(90deg, transparent 0%, var(--accent-gold-dim) 100%); padding-left: 12px; padding-right: 8px; border-radius: 10px; border-bottom-color: transparent; }
        .menu-item:hover .item-name { color: var(--accent-gold); letter-spacing: 0.5px; }
        .menu-item:hover .price { transform: scale(1.1); text-shadow: 0 0 12px var(--accent-gold-dim); }
        .price { transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), text-shadow 0.3s ease; }
        .menu-item:hover .fav-btn svg { stroke: var(--accent-gold); transform: scale(1.15); }
        .fav-btn svg { transition: var(--transition-spring); }
        .section-title { transition: letter-spacing 0.5s cubic-bezier(0.25, 1, 0.5, 1), color 0.3s ease, text-shadow 0.3s ease; }
        .section-title:hover { letter-spacing: 2px; text-shadow: 0 0 20px var(--accent-gold-dim); }
        .nav-tab { transition: color 0.3s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .nav-tab:hover { transform: translateY(-2px); }
        .icon-btn svg { transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .icon-btn:hover svg { transform: rotate(12deg) scale(1.15); }
        .recent-chip { transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease; }
        .recent-chip:hover { transform: translateY(-3px) scale(1.04); box-shadow: 0 6px 16px var(--accent-gold-dim); }
        .cart-item { transition: background 0.25s ease, padding 0.3s ease, border-radius 0.3s ease; border-radius: 8px; }
        .cart-item:hover { background: var(--accent-gold-dim); padding-left: 10px; padding-right: 10px; }
        .addon-item { transition: padding-left 0.3s cubic-bezier(0.25, 1, 0.5, 1), border-color 0.3s ease, color 0.3s ease; }
        .addon-item:hover { padding-left: 8px; border-bottom-color: var(--accent-gold); color: var(--accent-gold); }
        .addon-check { transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.3s ease, background 0.3s ease; }
        .addon-check:hover { transform: translateX(4px); }
        .pill { transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.3s ease, background 0.3s ease, color 0.3s ease; }
        .pill:hover { transform: translateY(-2px) scale(1.04); }
        .star-btn { transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.3s ease; }
        .star-btn:hover { transform: scale(1.3) rotate(-8deg); }
        .receipt-card { transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.3s ease, box-shadow 0.3s ease; }
        .receipt-card:hover { transform: translateY(-3px); border-color: var(--accent-gold); box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35); }
        .admin-row { transition: background 0.25s ease, padding 0.3s ease, border-radius 0.3s ease; border-radius: 6px; }
        .admin-row:hover { background: var(--accent-gold-dim); padding-left: 10px; padding-right: 10px; }
        .stat-card { transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.3s ease, box-shadow 0.3s ease; }
        .stat-card:hover { transform: translateY(-4px); border-color: var(--accent-gold); box-shadow: 0 8px 20px var(--accent-gold-dim); }
        .admin-btn { transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.3s ease, color 0.3s ease; }
        .admin-btn:hover { transform: translateY(-2px); }
        details.addons { transition: border-color 0.3s ease, box-shadow 0.3s ease; }
        details.addons:hover { border-color: var(--accent-gold); box-shadow: 0 6px 20px var(--accent-gold-dim); }
        .order-step { transition: background 0.25s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .order-step:not(.complete):not(.active):hover { transform: translateY(-2px); }

        /* SCROLL REVEAL */
        .scroll-reveal { opacity: 0; transform: translateY(35px); transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1), transform 0.8s cubic-bezier(0.25, 1, 0.5, 1); will-change: opacity, transform; }
        .scroll-reveal.visible { opacity: 1; transform: translateY(0); }

        @media (max-width: 400px) {
            .item-prices { min-width: 100px; gap: 10px; }
            .price { width: 25px; font-size: 0.85rem; }
            .size-headers { font-size: 0.55rem; gap: 10px; }
            .brand-name { font-size: 2.5rem; }
            .addons-content { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
            .stat-value { font-size: 1.3rem; }
            .order-step-label { font-size: 0.55rem; }
            .order-toggle-btn { width: 38px; height: 38px; }
            .order-toggle-btn .qr-icon { width: 20px; height: 20px; }
            .qr-preview img { width: 160px; height: 160px; }
        }
    </style>
</head>

    // SOUND ENGINE
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }
    function playSound(type) {
        if (!state.soundEnabled) return;
        initAudio(); if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'sine';
        switch (type) {
            case 'click': osc.frequency.setValueAtTime(900, now); gain.gain.setValueAtTime(0.04, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06); osc.start(now); osc.stop(now + 0.07); break;
            case 'pop': osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(1200, now + 0.08); gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12); osc.start(now); osc.stop(now + 0.13); break;
            case 'success': osc.frequency.setValueAtTime(523, now); osc.frequency.setValueAtTime(659, now + 0.1); osc.frequency.setValueAtTime(784, now + 0.2); gain.gain.setValueAtTime(0.06, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45); osc.start(now); osc.stop(now + 0.45); break;
            case 'error': osc.frequency.setValueAtTime(220, now); osc.frequency.exponentialRampToValueAtTime(140, now + 0.15); gain.gain.setValueAtTime(0.06, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2); osc.start(now); osc.stop(now + 0.2); break;
            case 'open': osc.frequency.setValueAtTime(500, now); osc.frequency.exponentialRampToValueAtTime(750, now + 0.12); gain.gain.setValueAtTime(0.035, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18); osc.start(now); osc.stop(now + 0.18); break;
            case 'toggle': osc.frequency.setValueAtTime(700, now); osc.frequency.exponentialRampToValueAtTime(1000, now + 0.06); gain.gain.setValueAtTime(0.045, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1); osc.start(now); osc.stop(now + 0.11); break;
        }
    }
    function toggleSound() {
        state.soundEnabled = !state.soundEnabled;

    function isFavorite(name) { return state.favorites.includes(name); }
    function toggleFavorite(name) {
        const idx = state.favorites.indexOf(name);
        if (idx > -1) { state.favorites.splice(idx, 1); showToast(t('removedFromFavorites'), false); }
        else { state.favorites.push(name); showToast(t('addToFavorites')); playSound('pop'); }

    function updateFavCounts() {
        const favTab = document.querySelector('[data-category="favorites"]');

    function getItemPrice(item, category) {
        if (category.type === 'drink') {
            if (state.selectedSizeIndex !== null && item.prices[state.selectedSizeIndex] !== null) return item.prices[state.selectedSizeIndex];
            for (let i = item.prices.length - 1; i >= 0; i--) if (item.prices[i] !== null) return item.prices[i];
            return 0;
        }
        return item.price;
    }

    function getRating(name) {
        const r = state.ratings[name];
        if (!r || r.count === 0) return { avg: 0, count: 0, user: 0 };
        return { avg: r.sum / r.count, count: r.count, user: r.user || 0 };
    }

    function getPopularItems() {
        const io = state.analytics.itemOrders || {};
        return Object.entries(io).sort((a, b) => b[1] - a[1]).slice(0, 3).filter(([_, c]) => c > 0).map(([n]) => n);
    }

    function trackView(name) {
        state.analytics.views = (state.analytics.views || 0) + 1;
        if (!state.analytics.itemViews) state.analytics.itemViews = {};
        state.analytics.itemViews[name] = (state.analytics.itemViews[name] || 0) + 1;
        state.recentlyViewed = [name, ...state.recentlyViewed.filter(n => n !== name)].slice(0, 8);
        saveState(); renderRecentlyViewed();
    }

    function trackOrder(name, qty) {
        state.analytics.orders = (state.analytics.orders || 0) + 1;
        if (!state.analytics.itemOrders) state.analytics.itemOrders = {};
        state.analytics.itemOrders[name] = (state.analytics.itemOrders[name] || 0) + qty;
        saveState();
    }

    const revealObserver = new IntersectionObserver((entries) => {

    // BRAND NAME ANIMATION
    function splitBrandLetters() {
        const text = brandLogo.textContent.trim();
        brandLogo.innerHTML = '';
        [...text].forEach((char, i) => {
            const span = document.createElement('span');
            span.className = 'letter';
            span.style.setProperty('--i', i);
            span.textContent = char === ' ' ? '\u00A0' : char;
            brandLogo.appendChild(span);
        });
    }

    function playBrandAnimation() {
        if (brandLogo.classList.contains('animating')) {
            brandLogo.classList.remove('animating'); void brandLogo.offsetWidth;
        }
        brandLogo.classList.add('animating');
        setTimeout(() => brandLogo.classList.remove('animating'), 1500);

        const rect = brandLogo.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;

        const count = 16;
        for (let i = 0; i < count; i++) {
            const p = document.createElement('span');
            p.className = 'gold-particle';
            const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
            const distance = 70 + Math.random() * 55;
            p.style.setProperty('--dx', (Math.cos(angle) * distance) + 'px');
            p.style.setProperty('--dy', (Math.sin(angle) * distance) + 'px');
            p.style.setProperty('--size', (3 + Math.random() * 4) + 'px');
            p.style.setProperty('--delay', (Math.random() * 0.15) + 's');
            p.style.left = cx + 'px'; p.style.top = cy + 'px';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 1700);
        }

        const ring = document.createElement('span');
        ring.className = 'brand-ripple';
        ring.style.left = cx + 'px'; ring.style.top = cy + 'px';
        document.body.appendChild(ring);
        setTimeout(() => ring.remove(), 1200);

        playSound('success'); haptic(20);
    }

    function buildSectionHTML(category) {
        const title = state.language === 'tl' && category.titleTl ? category.titleTl : category.title;
        let html = `<div class="section-header"><h2 class="section-title">${title}</h2>`;
        if (category.type === 'drink') html += `<div class="size-headers"><span>Hot 8oz</span><span>Hot 12oz</span><span>Ice 16oz</span></div>`;
        html += `</div>`;
        category.items.forEach((item, i) => { html += buildItemHTML(item, category, i); });
        return html;
    }

    function buildItemHTML(item, category, index) {
        const isSoldOut = item.available === false;
        const isFav = isFavorite(item.name);
        const soldOutClass = isSoldOut ? 'sold-out' : '';
        const delay = `style="animation-delay: ${index * 0.04}s"`;
        const popular = getPopularItems();
        const isPopular = popular.includes(item.name);
        const rating = getRating(item.name);
        let pricesHTML = '';
        if (category.type === 'drink') item.prices.forEach(p => { pricesHTML += `<span class="price">${p === null ? '—' : p}</span>`; });
        else pricesHTML = `<span class="price single">${item.price}</span>`;
        const noteHTML = item.note ? `<span class="item-note">${item.note}</span>` : '';
        const popHTML = isPopular ? `<span class="pop-badge">Popular</span>` : '';
        let metaHTML = '';
        if (rating.count > 0) {
            const stars = '★'.repeat(Math.round(rating.avg)) + '☆'.repeat(5 - Math.round(rating.avg));
            metaHTML = `<div class="item-meta"><span class="stars-mini">${stars}</span><span>${rating.avg.toFixed(1)} (${rating.count})</span></div>`;
        }
        return `<div class="menu-item ${soldOutClass}" data-item="${item.name}" data-cat="${category.id}" ${delay}>
            <div class="item-info"><h3 class="item-name">${item.name} ${popHTML}</h3>${noteHTML}${metaHTML}</div>
            <div class="item-actions"><div class="item-prices">${pricesHTML}</div>
            <button class="fav-btn ${isFav ? 'active' : ''}" data-fav="${item.name}">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
            </button></div></div>`;
    }

    function renderAddOns() {
        addonsContainer.innerHTML = '';
        addOnsData.forEach(a => {
            const div = document.createElement('div');
            div.className = 'addon-item';
            div.innerHTML = `<span>${a.name}</span><span class="addon-price">+${a.price}</span>`;
            addonsContainer.appendChild(div);

    function renderRecentlyViewed() {
        if (state.recentlyViewed.length === 0) { recentStrip.classList.remove('show'); return; }
        recentStrip.classList.add('show');
        recentScroll.innerHTML = state.recentlyViewed.map(name => {
            const item = menuData.flatMap(c => c.items).find(i => i.name === name);
            if (!item || item.available === false) return '';
            return `<button class="recent-chip" data-recent="${name}">${name}</button>`;
        }).join('');
        recentScroll.querySelectorAll('.recent-chip').forEach(chip => chip.addEventListener('click', () => {
            const name = chip.dataset.recent;
            for (const cat of menuData) if (cat.items.find(i => i.name === name)) { openItemSheet(name, cat.id); break; }
        }));
    }

    function renderFavorites() {
        const favSection = document.getElementById('favorites');
        const allItems = [];
        menuData.forEach(cat => cat.items.forEach(item => { if (isFavorite(item.name)) allItems.push({ item, cat }); }));
        if (allItems.length === 0) {
            favSection.innerHTML = `<div class="section-header"><h2 class="section-title">${t('favorites')}</h2></div>
                <div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                <h3>${t('noFavorites')}</h3><p>${t('noFavoritesSub')}</p></div>`;
            return;
        }
        let html = `<div class="section-header"><h2 class="section-title">${t('favorites')}</h2></div>`;
        allItems.forEach(({ item, cat }, i) => { html += buildItemHTML(item, cat, i); });
        favSection.innerHTML = html;
    }

    function renderSearchResults(query) {
        const q = query.toLowerCase().trim();
        const searchSection = document.getElementById('search-results');
        if (!q) {
            if (searchSection) searchSection.remove();
            document.querySelectorAll('.menu-section').forEach(s => s.classList.remove('active'));
            const cur = document.getElementById(state.currentCategory);
            if (cur) cur.classList.add('active');
            return;
        }
        const results = [];
        menuData.forEach(cat => cat.items.forEach(item => { if (item.name.toLowerCase().includes(q)) results.push({ item, cat }); }));
        let existing = document.getElementById('search-results');
        if (!existing) { existing = document.createElement('div'); existing.className = 'menu-section'; existing.id = 'search-results'; menuContainer.appendChild(existing); }
        document.querySelectorAll('.menu-section').forEach(s => s.classList.remove('active'));
        existing.classList.add('active');
        if (results.length === 0) {
            existing.innerHTML = `<div class="section-header"><h2 class="section-title">${t('noResults')}</h2></div>
                <div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <h3>${t('nothingFound')}</h3><p>${t('tryDifferent')}</p></div>`;
            return;
        }
        let html = `<div class="section-header"><h2 class="section-title">${t('results')} (${results.length})</h2></div>`;
        results.forEach(({ item, cat }, i) => { html += buildItemHTML(item, cat, i); });
        existing.innerHTML = html;
    }

    function openItemSheet(itemName, catId) {
        const category = menuData.find(c => c.id === catId);
        if (!category) return;
        const item = category.items.find(i => i.name === itemName);
        if (!item || item.available === false) return;
        state.selectedItem = item; state.selectedCategory = category;
        state.quantity = 1; state.selectedAddons = []; state.selectedNote = '';
        state.selectedRating = getRating(item.name).user || 0;
        if (category.type === 'drink') {
            state.selectedSizeIndex = item.prices.findIndex(p => p !== null);
            if (state.selectedSizeIndex === -1) state.selectedSizeIndex = 0;
        } else state.selectedSizeIndex = null;
        trackView(item.name); renderItemSheet(); openSheet(itemSheet); playSound('open'); haptic();
    }

    function renderItemSheet() {
        const item = state.selectedItem, cat = state.selectedCategory;
        const basePrice = getItemPrice(item, cat);
        const addonsTotal = state.selectedAddons.reduce((sum, name) => { const a = addOnsData.find(x => x.name === name); return sum + (a ? a.price : 0); }, 0);
        const total = (basePrice + addonsTotal) * state.quantity;
        const rating = getRating(item.name);
        let sizeHTML = '';
        if (cat.type === 'drink') {
            sizeHTML = `<div class="sheet-group"><div class="sheet-label">${t('selectSize')}</div><div class="pill-group">
                ${SIZE_OPTIONS.map(opt => {
                    const price = item.prices[opt.index], disabled = price === null, active = state.selectedSizeIndex === opt.index;
                    return `<button class="pill ${active ? 'active' : ''}" data-size="${opt.index}" ${disabled ? 'disabled style="opacity:0.3;pointer-events:none"' : ''}>${opt.label}<small>${opt.sub}</small><small>${price === null ? '—' : '₱' + price}</small></button>`;
                }).join('')}</div></div>`;
        }
        const ratingInfo = rating.count > 0 ? `${rating.avg.toFixed(1)} ★ · ${rating.count} ${t('ratingsCount')}` : '';
        itemSheetContent.innerHTML = `
            <div class="sheet-header"><div><h2 class="sheet-title">${item.name}</h2>${item.note ? `<span class="sheet-subtitle">${item.note}</span>` : ''}</div>
            <button class="sheet-close" id="sheet-close-btn"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button></div>
            ${sizeHTML}
            <div class="sheet-group"><div class="sheet-label">${t('addons')}</div>
                ${addOnsData.map(a => {
                    const active = state.selectedAddons.includes(a.name);
                    return `<div class="addon-check ${active ? 'active' : ''}" data-addon="${a.name}"><div class="addon-check-name"><div class="check-box"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div><span>${a.name}</span></div><span class="addon-check-price">+${a.price}</span></div>`;
                }).join('')}</div>
            <div class="sheet-group"><div class="sheet-label">${t('specialInstructions')}</div><textarea class="notes-textarea" id="item-note" placeholder="${t('notePlaceholder')}">${state.selectedNote}</textarea></div>
            <div class="rating-row"><span class="rating-label">${t('rateItem')}</span>
                <div style="text-align:right"><div class="stars" id="stars-container">
                    ${[1,2,3,4,5].map(n => `<button class="star-btn ${n <= state.selectedRating ? 'active' : ''}" data-star="${n}"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg></button>`).join('')}
                </div>${ratingInfo ? `<div class="rating-info">${ratingInfo}</div>` : ''}</div></div>
            <div class="quantity-row"><span class="qty-label">${t('quantity')}</span><div class="qty-controls">
                <button class="qty-btn" id="qty-minus" ${state.quantity <= 1 ? 'disabled' : ''}>−</button><span class="qty-value">${state.quantity}</span><button class="qty-btn" id="qty-plus">+</button>
            </div></div>
            <div class="sheet-footer"><div class="total-display"><div class="total-label">${t('total')}</div><div class="total-value">₱${total}</div></div>
                <button class="btn-primary" id="add-to-cart-btn"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>${t('addToOrder')}</button>
            </div>`;
        attachSheetListeners();
    }

    function attachSheetListeners() {
        itemSheetContent.querySelectorAll('.pill[data-size]').forEach(p => p.addEventListener('click', () => { state.selectedSizeIndex = parseInt(p.dataset.size); playSound('click'); haptic(); renderItemSheet(); }));
        itemSheetContent.querySelectorAll('.addon-check').forEach(c => c.addEventListener('click', () => {
            const name = c.dataset.addon, idx = state.selectedAddons.indexOf(name);
            if (idx > -1) state.selectedAddons.splice(idx, 1); else state.selectedAddons.push(name);
            playSound('click'); haptic(); renderItemSheet();
        }));
        itemSheetContent.querySelectorAll('.star-btn').forEach(s => s.addEventListener('click', () => {
            state.selectedRating = parseInt(s.dataset.star);
            const name = state.selectedItem.name;
            const old = state.ratings[name] || { sum: 0, count: 0, user: 0 };
            if (old.user > 0) { old.sum -= old.user; old.count -= 1; }
            old.sum += state.selectedRating; old.count += 1; old.user = state.selectedRating;
            state.ratings[name] = old;
            saveState(); showToast(`Rated ${state.selectedRating} ★`); playSound('pop'); haptic(); renderItemSheet();
        }));
        const noteEl = document.getElementById('item-note');
        if (noteEl) noteEl.addEventListener('input', e => { state.selectedNote = e.target.value; });
        const minus = document.getElementById('qty-minus'), plus = document.getElementById('qty-plus');
        if (minus) minus.addEventListener('click', () => { if (state.quantity > 1) { state.quantity--; playSound('click'); haptic(); renderItemSheet(); } });
        if (plus) plus.addEventListener('click', () => { state.quantity++; playSound('click'); haptic(); renderItemSheet(); });
        const close = document.getElementById('sheet-close-btn');
        if (close) close.addEventListener('click', closeAllSheets);
        const add = document.getElementById('add-to-cart-btn');
        if (add) add.addEventListener('click', addToCart);
    }

    function addToCart() {
        const item = state.selectedItem, cat = state.selectedCategory;
        const basePrice = getItemPrice(item, cat);
        const addonsTotal = state.selectedAddons.reduce((sum, name) => { const a = addOnsData.find(x => x.name === name); return sum + (a ? a.price : 0); }, 0);
        const unitPrice = basePrice + addonsTotal;
        let sizeLabel = '';
        if (cat.type === 'drink' && state.selectedSizeIndex !== null) { const opt = SIZE_OPTIONS[state.selectedSizeIndex]; sizeLabel = `${opt.label} ${opt.sub}`; }
        state.cart.push({ id: Date.now() + Math.random(), name: item.name, category: cat.title, size: sizeLabel, addons: [...state.selectedAddons], note: state.selectedNote.trim(), unitPrice, quantity: state.quantity });
        trackOrder(item.name, state.quantity);
        saveState(); updateCartBadge(); closeAllSheets();
        showToast(`${item.name} ${t('addedToOrder')}`); playSound('success'); haptic(20);
    }

    function updateCartBadge() {
        const tq = state.cart.reduce((sum, i) => sum + i.quantity, 0);
        cartBadge.textContent = tq;
        if (tq > 0) cartFab.classList.add('visible'); else cartFab.classList.remove('visible');
    }

    function renderCart() {
        if (state.cart.length === 0) {
            cartContent.innerHTML = `<h2 class="cart-title">${t('yourOrder')}</h2>
                <div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                <h3>${t('emptyCart')}</h3><p>${t('emptyCartSub')}</p></div>`;
            return;
        }
        const total = state.cart.reduce((sum, i) => sum + (i.unitPrice * i.quantity), 0);
        cartContent.innerHTML = `
            <h2 class="cart-title">${t('yourOrder')}</h2>
            <div class="table-input-group"><input type="text" class="table-input" id="table-number" placeholder="${t('tableNumber')}" value="${state.tableNumber}" maxlength="10"></div>
            ${state.cart.map(item => {
                const cust = []; if (item.size) cust.push(item.size); if (item.addons.length) cust.push(item.addons.join(', '));
                const c = cust.length ? cust.join(' • ') : '';
                const n = item.note ? `Note: ${item.note}` : '';
                return `<div class="cart-item"><div class="cart-item-info"><div class="cart-item-name">${item.name}</div>
                    ${c ? `<div class="cart-item-customization">${c}</div>` : ''}${n ? `<div class="cart-item-note">${n}</div>` : ''}</div>
                    <div class="cart-item-controls"><div class="cart-item-price">₱${item.unitPrice * item.quantity}</div>
                    <div class="cart-item-qty"><button class="cart-qty-btn" data-action="dec" data-id="${item.id}">−</button><span>${item.quantity}</span><button class="cart-qty-btn" data-action="inc" data-id="${item.id}">+</button></div></div></div>`;
            }).join('')}
            <div class="cart-total-row"><span class="cart-total-label">${t('total')}</span><span class="cart-total-value">₱${total}</span></div>
            <div class="cart-actions"><button class="btn-secondary" id="clear-cart-btn">${t('clear')}</button>
                <button class="btn-primary full" id="checkout-btn"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>${t('confirmOrder')}</button></div>`;
        attachCartListeners();
    }

    function attachCartListeners() {
        const ti = document.getElementById('table-number');
        if (ti) ti.addEventListener('input', e => { state.tableNumber = e.target.value; saveState(); });
        cartContent.querySelectorAll('.cart-qty-btn').forEach(btn => btn.addEventListener('click', () => {
            const id = parseFloat(btn.dataset.id), action = btn.dataset.action;
            const item = state.cart.find(i => i.id === id); if (!item) return;
            if (action === 'inc') item.quantity++;
            else { item.quantity--; if (item.quantity <= 0) state.cart = state.cart.filter(i => i.id !== id); }
            saveState(); updateCartBadge(); renderCart(); playSound('click'); haptic();
        }));
        const cb = document.getElementById('clear-cart-btn');
        if (cb) cb.addEventListener('click', () => { state.cart = []; saveState(); updateCartBadge(); renderCart(); showToast(t('orderCleared'), false); playSound('error'); haptic(); });
        const ckb = document.getElementById('checkout-btn');
        if (ckb) ckb.addEventListener('click', checkout);
    }

    function checkout() {
        if (!state.tableNumber.trim()) {
            showToast(t('tableRequired'), false); playSound('error'); haptic(30);
            const ti = document.getElementById('table-number');
            if (ti) { ti.focus(); ti.style.borderColor = 'var(--danger)'; setTimeout(() => ti.style.borderColor = '', 1500); }
            return;
        }
        const total = state.cart.reduce((sum, i) => sum + (i.unitPrice * i.quantity), 0);
        const orderId = 'AR-' + String(Date.now()).slice(-4);

        let orderText = '☕ Aroastotle Cafe Order ☕\n';
        orderText += `Order: ${orderId}\nTable: ${state.tableNumber}\n\n`;
        state.cart.forEach(item => {
            const cust = []; if (item.size) cust.push(item.size); if (item.addons.length) cust.push(item.addons.join(', '));
            const c = cust.length ? ` (${cust.join(' • ')})` : '';
            orderText += `• ${item.quantity}x ${item.name}${c} — ₱${item.unitPrice * item.quantity}\n`;
            if (item.note) orderText += `   ↳ Note: ${item.note}\n`;
        });
        orderText += `\nTotal: ₱${total}`;

        const cp = navigator.clipboard ? navigator.clipboard.writeText(orderText) : Promise.resolve().then(() => {
            const ta = document.createElement('textarea'); ta.value = orderText;
            document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
        });

        cp.finally(() => {
            state.currentOrder = { id: orderId, placedAt: Date.now(), stage: 1, total, table: state.tableNumber, items: [...state.cart] };
            state.orderBarHidden = false;
            saveState();
            closeAllSheets();
            updateOrderBar();
            showOrderBar();
            playSound('success'); haptic(30);
        });
    }

    let orderBarAutoCollapseTimer = null;

    function getOrderStage(order) { if (!order) return 0; return order.stage || 1; }

    function showOrderBar() {
        orderBar.classList.add('show');
        document.body.classList.add('has-order-bar');
        setOrderBarExpanded(true, true);
    }

    function hideOrderBar(dismiss = false) {
        orderBar.classList.remove('show');
        if (dismiss) orderBar.classList.add('dismiss');
        document.body.classList.remove('has-order-bar');
        if (orderBarAutoCollapseTimer) { clearTimeout(orderBarAutoCollapseTimer); orderBarAutoCollapseTimer = null; }
    }

    function setOrderBarExpanded(expanded, silent = false) {
        state.orderBarExpanded = expanded;
        orderBar.classList.toggle('expanded', expanded);
        if (!silent) { playSound('toggle'); haptic(); }
    }

    function toggleOrderBar() {
        const btn = orderToggleBtn;
        btn.classList.add('clicked');
        setTimeout(() => btn.classList.remove('clicked'), 700);
        setOrderBarExpanded(!state.orderBarExpanded);
    }

    function advanceOrderStage(targetStage) {
        const order = state.currentOrder;
        if (!order) return;
        const currentStage = order.stage || 1;
        if (targetStage <= currentStage) return;
        if (targetStage < 1 || targetStage > 3) return;
        order.stage = targetStage;
        saveState(); updateOrderBar();
        if (targetStage === 2) { playSound('pop'); haptic(20); showToast(t('statusPreparing')); }
        else if (targetStage === 3) { playSound('success'); haptic(40); showToast(t('orderReadyTitle')); }
    }

    function updateOrderBar() {
        const order = state.currentOrder;
        if (!order) return;
        const stage = getOrderStage(order);
        const titles = { 1: t('orderConfirmed'), 2: t('orderInProgress'), 3: t('orderReadyTitle') };
        orderBarTitle.innerHTML = `<span>${titles[stage]}</span>${stage < 3 ? '<span class="live-dot"></span>' : ''}`;
        orderBarSub.textContent = `${order.id} • Table ${order.table} • ₱${order.total}`;

        orderBarStatus.classList.remove('pulsing', 'complete');
        if (stage === 1 || stage === 2) {
            orderBarStatus.classList.add('pulsing');
            orderBarStatusIcon.innerHTML = stage === 1 ? '<polyline points="20 6 9 17 4 12"></polyline>' : '<circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline>';
        } else {
            orderBarStatus.classList.add('complete');
            orderBarStatusIcon.innerHTML = '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>';
        }

        orderBar.querySelectorAll('.order-step').forEach(step => {
            const n = parseInt(step.dataset.step);
            step.classList.toggle('complete', n < stage);
            step.classList.toggle('active', n === stage);
        });

        const progressPct = stage === 1 ? 0 : stage === 2 ? 50 : 100;
        orderProgressLine.style.width = `${progressPct * 0.64}%`;

        const messages = { 1: t('etaReceived'), 2: t('etaPreparing'), 3: t('etaReady') };
        orderEta.innerHTML = stage === 3 ? `🎉 <strong>${messages[3]}</strong>` : messages[stage];

        orderStaffHint.style.display = stage >= 3 ? 'none' : 'flex';
        orderStaffHint.querySelector('span').textContent = t('staffHint');
        orderDoneBtn.textContent = stage === 3 ? t('statusDone') : t('hide');
    }

    function completeOrder() {
        const order = state.currentOrder;
        if (!order) return;
        state.orderHistory.unshift({
            id: order.id, placedAt: order.placedAt, completedAt: Date.now(),
            table: order.table, total: order.total, items: order.items
        });
        state.orderHistory = state.orderHistory.slice(0, 50);
        state.currentOrder = null;
        state.cart = [];
        saveState();
        hideOrderBar(true);
        updateCartBadge();
        playSound('success'); haptic(30);
        setTimeout(() => orderBar.classList.remove('dismiss'), 700);
        showToast(t('orderCompleted'));
    }

    orderBarHeader.addEventListener('click', (e) => {
        if (e.target.closest('.order-toggle-btn')) return;
        toggleOrderBar();
    });
    orderToggleBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleOrderBar(); });
    orderDismissBtn.addEventListener('click', () => {
        state.orderBarHidden = true; hideOrderBar();
        playSound('click'); haptic();
    });
    orderDoneBtn.addEventListener('click', () => {
        const stage = getOrderStage(state.currentOrder);
        if (stage === 3) completeOrder();
        else setOrderBarExpanded(false);
    });

    orderTimeline.querySelectorAll('.order-step').forEach(step => {
        step.addEventListener('click', () => {
            const targetStage = parseInt(step.dataset.step);
            const currentStage = getOrderStage(state.currentOrder);
            if (targetStage > currentStage) advanceOrderStage(targetStage);
            else haptic(5);
        });
    });

    async function shareMenu() {
        const shareData = { title: 'Aroastotle Cafe', text: 'Check out the Aroastotle Cafe menu!', url: window.location.href };
        try {
            if (navigator.share) await navigator.share(shareData);
            else { await navigator.clipboard.writeText(shareData.url); showToast(t('shared')); }
            playSound('pop'); haptic();
        } catch (err) {}
    }

    function openAdmin() { renderAdmin(); openSheet(adminModal); playSound('open'); haptic(30); }

            </div>

            <div class="admin-section">
                <div class="admin-section-title">📱 Share Menu via QR</div>
                <div class="qr-section-card">
                    <div class="qr-input-row">
                        <input type="text" class="qr-table-input" id="qr-table-input" placeholder="Table # (optional)" maxlength="10">

                    <div class="qr-hint">Leave table blank for a general menu QR • Enter a number for table-specific codes</div>

                    topItems.map(([name, count], i) => `<div class="admin-row"><div style="flex:1"><div class="admin-row-name">${i + 1}. ${name}</div></div><div class="admin-row-sub" style="color:var(--accent-gold);font-weight:600;">${count}x</div></div>`).join('')}
